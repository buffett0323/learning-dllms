  <rect class="a" x="2" y="4" width="10" height="6" rx="2"/>
  <rect class="m" x="14" y="4" width="16" height="6" rx="2"/>
  <rect class="m" x="2" y="13" width="15" height="6" rx="2"/>
  <rect class="a" x="19" y="13" width="11" height="6" rx="2"/>
  <rect class="a" x="2" y="22" width="19" height="6" rx="2"/>
  <rect class="m" x="23" y="22" width="7" height="6" rx="2"/>
</svg>
